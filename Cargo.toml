[package]
name = "smart_brain_engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
network_websocket = []
bluetooth_api = []
webrtc_api = []
usb_api = []

[dependencies]
eframe = { version = "0.27.2", features = ["wgpu"] } # Egui + winit + wgpu context
wgpu = "0.19"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.15", features = ["derive"] }
glam = "0.27"
tokio = { version = "1.37", features = ["full"] }

# Phase E: HFT Math & Native OS Export Engine Dependencies
polars = { version = "0.38", features = ["lazy", "dtype-datetime"] }
rust_xlsxwriter = "0.64"
printpdf = "0.7"
